# Compiles the BoomBigNose Wails window. It does not publish a release.
# A green build is a binary that can open; it is not a click-through of the
# macOS or Windows warning dialogs.
# ubuntu-latest is amd64. ubuntu-24.04-arm is aarch64 and is not a physical DGX.
name: BoomBigNose desktop shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Install local Postgres for the cutover test
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql
      - name: Test harness and navigation script
        working-directory: boombignose
        run: go test ./...
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test ERP flows
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm install --frozen-lockfile
          pnpm test

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Install WebKit
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build window
        working-directory: boombignose
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build -tags "desktop production webkit2_41" -o ../dist/boombignose-desktop ./cmd/boombignose-desktop
          test -s ../dist/boombignose-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist/boombignose-desktop
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Require arm64
        run: |
          test "$(uname -m)" = aarch64
          go env GOARCH | grep -qx arm64
      - name: Install local Postgres for the cutover test
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql
      - name: Test harness and navigation script
        working-directory: boombignose
        run: go test ./...
      - name: Install WebKit
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev file
      - name: Build window
        working-directory: boombignose
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build -tags "desktop production webkit2_41" -o ../dist/boombignose-desktop ./cmd/boombignose-desktop
          test -s ../dist/boombignose-desktop
          file ../dist/boombignose-desktop | grep -q aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-desktop
          path: dist/boombignose-desktop
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build window
        working-directory: boombignose
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          go build -tags "desktop production" -ldflags "-H windowsgui" -o ..\dist\boombignose-desktop.exe ./cmd/boombignose-desktop
          if (-not (Test-Path ..\dist\boombignose-desktop.exe)) { throw "window binary missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/boombignose-desktop.exe
          if-no-files-found: error

  macos:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build window
        working-directory: boombignose
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build -tags "desktop production" -o ../dist/boombignose-desktop ./cmd/boombignose-desktop
          test -s ../dist/boombignose-desktop
          codesign --force --sign - ../dist/boombignose-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: dist/boombignose-desktop
          if-no-files-found: error
