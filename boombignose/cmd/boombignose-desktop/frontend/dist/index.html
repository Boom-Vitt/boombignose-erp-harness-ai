<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BoomBigNose ERP Harness AI</title>
  <style>
    :root { --bg: #0b1222; --navy: #14264a; --text: #f3f6fd; --muted: #c0cae0; --line: rgba(160, 185, 235, .30); --accent: #f59e42; --gold: #f5c561; --err: #ffb4a8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Sukhumvit Set", Thonburi, system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    main { position: relative; display: grid; gap: 16px; justify-items: center; width: min(32rem, calc(100% - 32px)); padding: 34px 30px 28px; text-align: center; border-radius: 22px; background: linear-gradient(180deg, rgba(24, 42, 80, .78), rgba(12, 22, 44, .82)); -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25); border: 1px solid var(--line); box-shadow: 0 0 0 1px rgba(245, 158, 66, .22), 0 0 44px rgba(245, 158, 66, .16), 0 18px 48px rgba(3, 8, 20, .5), inset 0 1px 0 rgba(255, 255, 255, .10); }
    .tile { width: 84px; height: 84px; padding: 8px; border-radius: 24px; background: #fff; box-shadow: 0 0 0 3px rgba(245, 158, 66, .85), 0 0 0 7px rgba(245, 158, 66, .20), 0 8px 26px rgba(245, 158, 66, .35); }
    .tile img { display: block; width: 100%; height: 100%; object-fit: contain; }
    h1 { margin: 4px 0 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: .01em; }
    h1 b { color: var(--accent); font-weight: 700; }
    p { margin: 0; line-height: 1.65; }
    #status-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 28px; }
    #boot-status { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
    #boot-status.err { color: var(--err); font-weight: 500; font-size: 15px; }
    .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .spin { color: var(--accent); animation: spin 1s linear infinite; }
    .spin.off { animation: none; color: var(--err); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { width: 100%; height: 4px; border-radius: 4px; background: rgba(160, 185, 235, .22); overflow: hidden; }
    .bar i { display: block; width: 38%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--gold)); animation: slide 1.4s ease-in-out infinite; }
    .bar.done i { width: 100%; animation: none; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(270%); } }
    .actions { display: grid; gap: 10px; width: 100%; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, opacity .15s; }
    button[hidden] { display: none; }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: progress; }
    #open-erp { background: linear-gradient(180deg, #fbb35f, var(--accent)); color: #1a1004; border: 0; font-size: 16px; padding: 13px 18px; box-shadow: 0 6px 20px rgba(245, 158, 66, .35); }
    #open-erp:hover { background: linear-gradient(180deg, #ffc27a, #f9a74e); }
    #pull-model { background: rgba(255, 255, 255, .06); color: var(--text); border: 1px solid var(--line); }
    #pull-model:hover:not(:disabled) { background: rgba(255, 255, 255, .12); border-color: rgba(245, 158, 66, .6); }
    #pull-status { color: var(--muted); font-size: 14px; }
    #pull-detail { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; opacity: .85; }
    #pull-detail:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { .spin, .bar i { animation: none; } button { transition: none; } }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <main>
    <div class="tile"><img src="brandmark.png" alt="" /></div>
    <h1>BoomBigNose <b>ERP</b></h1>
    <div id="status-row" role="status" aria-live="polite">
      <svg id="spinner" class="i spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <span id="boot-status">กำลังเปิด ERP ที่ 127.0.0.1:3100</span>
    </div>
    <div id="bar" class="bar" aria-hidden="true"><i></i></div>
    <div class="actions">
      <button id="open-erp" type="button" hidden>เปิด ERP</button>
      <button id="pull-model" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg><span id="pull-label">ดาวน์โหลดโมเดล qwen3.5:4b</span></button>
    </div>
    <p id="pull-status">การเปิดโปรแกรมไม่ได้ดาวน์โหลดโมเดล หลังเข้า ERP แล้ว ติดตั้งโมเดลได้ที่ Settings โดยไม่ต้องลงแอป AI อื่น</p>
    <p id="pull-detail"></p>
  </main>
  <script>
    // Same perspective campus as bignose/desktop/src/stage.ts. Plain canvas: this window has no bundler.
    // DPR <= 1.5, ~30 fps, paused while hidden, one still frame under prefers-reduced-motion.
    (function () {
      var TOWERS = [[-5, 3, 1.4, 1.4, 2.6], [-2.6, 5, 1.1, 1.1, 1.6], [0.5, 4, 1.6, 1.2, 3.4], [3, 5.5, 1.2, 1.2, 2.2], [5.5, 3.2, 1.5, 1.5, 2.9], [-6, -3, 1.2, 1.2, 1.4], [6.2, -2.4, 1.3, 1.3, 1.9], [-1.5, -5.5, 1.4, 1.1, 2.1], [2.8, -4.6, 1.1, 1.1, 1.2]];
      var canvas = document.getElementById("stage"), g = canvas.getContext("2d");
      if (!g) return;
      var still = matchMedia("(prefers-reduced-motion: reduce)"), raf = 0, last = 0, w = 0, h = 0;
      function draw(t) {
        var yaw = t * 0.00006 + 0.5, cs = Math.cos(yaw), sn = Math.sin(yaw), f = Math.min(w, h * 1.5) * 0.9;
        function proj(p) { var rx = p[0] * cs - p[2] * sn, rz = p[0] * sn + p[2] * cs + 11, k = f / rz; return [w / 2 + rx * k, h * 0.62 - (p[1] - 3.2) * k - 0.16 * h * (1 - 6 / rz), rz]; }
        var i, j, sky = g.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#2a4d8f"); sky.addColorStop(0.5, "#1d3868"); sky.addColorStop(1, "#112244");
        g.clearRect(0, 0, w, h); g.fillStyle = sky; g.fillRect(0, 0, w, h);
        var glow = g.createRadialGradient(w / 2, h * 0.62, 0, w / 2, h * 0.62, Math.max(w, h) * 0.55);
        glow.addColorStop(0, "rgba(245,158,66,.32)"); glow.addColorStop(0.5, "rgba(245,158,66,.10)"); glow.addColorStop(1, "rgba(245,158,66,0)");
        g.fillStyle = glow; g.fillRect(0, 0, w, h);
        g.lineWidth = 1; g.strokeStyle = "rgba(150,180,235,.42)";
        for (i = -12; i <= 12; i += 2) {
          [[[i, 0, -12], [i, 0, 12]], [[-12, 0, i], [12, 0, i]]].forEach(function (s) {
            var a = proj(s[0]), b = proj(s[1]);
            if (a[2] < 0.5 || b[2] < 0.5) return;
            g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
          });
        }
        g.strokeStyle = "rgba(245,175,90,.9)"; g.lineWidth = 2.5;
        function ring(a) { return [Math.cos(a) * 4, 0, Math.sin(a) * 2.6 - 0.4]; }
        g.beginPath();
        for (var a = 0; a <= 6.3; a += 0.2) { var r = proj(ring(a)); if (a === 0) g.moveTo(r[0], r[1]); else g.lineTo(r[0], r[1]); }
        g.stroke();
        var tr = proj(ring(t * 0.0006));
        g.fillStyle = "#f5c561"; g.fillRect(tr[0] - 120 / tr[2], tr[1] - 90 / tr[2], 240 / tr[2], 90 / tr[2]);
        TOWERS.map(function (b) {
          return { c: [[b[0] - b[2] / 2, 0, b[1] - b[3] / 2], [b[0] + b[2] / 2, 0, b[1] - b[3] / 2], [b[0] + b[2] / 2, 0, b[1] + b[3] / 2], [b[0] - b[2] / 2, 0, b[1] + b[3] / 2]], bh: b[4], depth: proj([b[0], 0, b[1]])[2] };
        }).sort(function (x, y) { return y.depth - x.depth; }).forEach(function (b, n) {
          var base = b.c.map(proj), top = b.c.map(function (p) { return proj([p[0], b.bh, p[2]]); });
          g.lineWidth = 1.6; g.strokeStyle = n % 4 === 0 ? "rgba(255,185,100,.95)" : "rgba(170,200,250,.85)";
          for (i = 0; i < 4; i++) {
            j = (i + 1) % 4; g.fillStyle = "rgba(38,68,124," + (0.7 + i * 0.06) + ")";
            g.beginPath(); g.moveTo(base[i][0], base[i][1]); g.lineTo(base[j][0], base[j][1]); g.lineTo(top[j][0], top[j][1]); g.lineTo(top[i][0], top[i][1]); g.closePath(); g.fill(); g.stroke();
          }
          g.fillStyle = "rgba(70,108,176,.85)"; g.beginPath();
          top.forEach(function (p, k) { if (k) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); });
          g.closePath(); g.fill(); g.stroke();
        });
        var vig = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45, w / 2, h / 2, Math.max(w, h) * 0.85);
        vig.addColorStop(0, "rgba(11,18,34,0)"); vig.addColorStop(1, "rgba(11,18,34,.35)");
        g.fillStyle = vig; g.fillRect(0, 0, w, h);
      }
      function size() { var d = Math.min(window.devicePixelRatio || 1, 1.5); canvas.width = Math.round(innerWidth * d); canvas.height = Math.round(innerHeight * d); g.setTransform(d, 0, 0, d, 0, 0); w = innerWidth; h = innerHeight; }
      function frame(now) {
        raf = 0;
        if (now - last >= 33) { last = now; draw(now); }
        if (!still.matches && !document.hidden) raf = requestAnimationFrame(frame);
      }
      function kick() { if (!raf) raf = requestAnimationFrame(frame); }
      size();
      window.addEventListener("resize", function () { size(); last = 0; kick(); });
      document.addEventListener("visibilitychange", kick);
      kick();
    })();

    (function () {
      var bridge = window.go && window.go.main && window.go.main.App;
      var $ = function (id) { return document.getElementById(id); };
      var statusEl = $("boot-status"), spinner = $("spinner"), bar = $("bar"), openBtn = $("open-erp");
      var target = "http://127.0.0.1:3100", entered = false, busy = false;

      function open() {
        if (bridge && bridge.OpenERP) bridge.OpenERP();
        // Fallback if the native script is lost.
        setTimeout(function () { window.location.replace(target); }, 1500);
      }
      function enter() {
        if (entered) return;
        entered = true;
        statusEl.className = "";
        statusEl.textContent = "ERP พร้อมแล้ว กำลังเข้า...";
        spinner.classList.remove("off");
        bar.classList.add("done");
        openBtn.hidden = false;
        open();
      }
      openBtn.addEventListener("click", open);

      // Called by nav.BootFailure. Keeps polling: if the ERP comes up later we still go in.
      window.bbnBootFailed = function (msg) {
        if (entered) return;
        statusEl.className = "err";
        statusEl.textContent = msg;
        spinner.classList.add("off");
      };

      if (bridge && bridge.ERPTarget) {
        bridge.ERPTarget().then(function (t) {
          if (!t) return;
          target = t;
          if (!entered && statusEl.className === "") statusEl.textContent = "กำลังเปิด ERP ที่ " + t.replace(/^https?:\/\//, "");
        }).catch(function () {});
      }
      if (bridge && bridge.ERPReady) {
        setInterval(function () {
          if (entered || busy) return;
          busy = true;
          bridge.ERPReady().then(function (ok) { if (ok) enter(); }).catch(function () {}).then(function () { busy = false; });
        }, 1000);
      }

      var pullBtn = $("pull-model"), pullLabel = $("pull-label"), pullStatus = $("pull-status"), pullDetail = $("pull-detail");
      var MODEL = "qwen3.5:4b";
      function pullMessage(raw) {
        var m = /^(ollama|network|timeout|other):\s*([\s\S]*)$/.exec(raw);
        var kind = m ? m[1] : "other", detail = m ? m[2] : raw;
        var text = {
          ollama: "ยังไม่พบ Ollama ที่ 127.0.0.1:11434 ลองเปิดใหม่ หรือติดตั้ง Ollama",
          network: "ดาวน์โหลดไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต แล้วลองอีกครั้ง",
          timeout: "ดาวน์โหลดใช้เวลานานเกินไป ตรวจสอบอินเทอร์เน็ต แล้วลองอีกครั้ง",
          other: "ดาวน์โหลดไม่สำเร็จ ลองอีกครั้ง"
        }[kind];
        return [text, detail];
      }
      pullBtn.addEventListener("click", function () {
        if (!bridge || !bridge.PullLocalModel) {
          pullStatus.textContent = "ปุ่มนี้ใช้ในหน้าต่าง BoomBigNose เท่านั้น คำสั่งคือ boombignose pull-model";
          return;
        }
        pullBtn.disabled = true;
        pullDetail.textContent = "";
        pullStatus.textContent = "กำลังดาวน์โหลด " + MODEL + " (อาจใช้เวลาหลายนาที)";
        bridge.PullLocalModel().then(function () {
          pullStatus.textContent = "ดาวน์โหลด " + MODEL + " แล้ว";
          pullLabel.textContent = "ดาวน์โหลดแล้ว";
        }).catch(function (err) {
          var parts = pullMessage(String((err && err.message) || err || ""));
          pullStatus.textContent = parts[0];
          pullDetail.textContent = parts[1];
          pullLabel.textContent = "ลองอีกครั้ง";
          pullBtn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
